<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Admin - Editar Produto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/admin-edit-produto.css">
</head>
<body>
  <header>
    <figure>
      <a href="index.html"><img src="image/logo2.png" id="imagem"></a>
    </figure>
    <nav class="noto-serif-texto" id="navbar">
      <a href="admin-produtos.html">Produtos</a>
      <a href="admin-add-produto.html">Adicionar Produto</a>
      <a href="admin-login.html">Sair</a>
    </nav>
  </header>

  <main>
    <section id="edicao">
      <h2>Editar Produto</h2>
      <!-- No PHP, os valores seriam carregados automaticamente -->
      <form action="update.php" method="POST" enctype="multipart/form-data" class="formulario_edicao">
        <input type="hidden" name="id" value="1">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="Bolo Floresta Negra" required>

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" rows="5" required>Um clássico bolo alemão com chantilly e cerejas.</textarea>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" name="preco" value="16.99" step="0.01" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" value="10" required>

        <label for="imagem">Imagem:</label>
        <input type="file" id="imagem" name="imagem" accept="image/*">

        <button type="submit">Atualizar Produto</button>
      </form>
    </section>
  </main>
</body>
</html>
